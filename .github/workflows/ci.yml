name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install dependencies (Makefile)
        run: |
          make install

      - name: Run model tests
        run: |
          make model-test

      - name: Run API tests
        run: |
          make api-test

      # OPTIONAL: only works if API is deployed and STRESS_URL is correct
      - name: Run stress test
        run: |
          make stress-test